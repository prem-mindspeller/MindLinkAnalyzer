name: Release – Single Channel (MindLink)

# Trigger: push a tag like v1.2.0-mindlink
on:
  push:
    tags:
      - 'v*-mindlink'

jobs:
  build-and-release:
    name: Build & Publish (Windows)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout the single-channel source branch ─────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feature/neuroprofile-traceability-v7

      # ── 2. Python backend (PyInstaller) ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python backend
        shell: pwsh
        run: |
          cd newBackend
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller
          .venv\Scripts\pyinstaller MindLinkBackend.spec

      # ── 3. Electron frontend ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ElectronFrontEnd/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: ElectronFrontEnd

      # ── 4. Build & publish to public releases repo ────────────────────────────
      # GH_TOKEN must be a PAT with write access to the public MindLink-Releases repo.
      # Add it as a repository secret named RELEASES_PAT in your private source repo.
      - name: Build and publish release
        run: npm run package -- --publish always
        working-directory: ElectronFrontEnd
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}

      # ── 5. Remove stale latest.yml from release (would cross-update MindRove users) ──
      - name: Delete latest.yml from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v' -replace '-mindlink$'
          gh release delete-asset v$version latest.yml --yes --repo Mindspeller/MindLink-Releases 2>$null || true

      # ── 6. Update download page (GitHub Pages) ────────────────────────────────
      - name: Update download page
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone https://x-access-token:$env:GH_TOKEN@github.com/Mindspeller/MindLink-Releases.git releases-repo
          cd releases-repo
          $version = $env:TAG -replace '^v' -replace '-mindlink$'
          Set-Content -Path mindlink-version.txt -Value $version -Encoding UTF8
          powershell -ExecutionPolicy Bypass -File generate-page.ps1
          git config user.email "ci@mindspeller.com"
          git config user.name "MindLink CI"
          git add mindlink-version.txt index.html
          git diff --cached --quiet || git commit -m "release: mindlink v$version"
          git push
