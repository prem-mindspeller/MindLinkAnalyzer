name: Release – 4-Channel (MindRove)

# Trigger: push a tag like n1.0.0-mindrove
on:
  push:
    tags:
      - 'n*-mindrove'

jobs:
  build-and-release:
    name: Build & Publish (Windows)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout the MindRove source branch ────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: mindrove-integration

      # ── 2. Python backend (PyInstaller) ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python backend
        shell: pwsh
        run: |
          cd newBackend
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller
          .venv\Scripts\pyinstaller MindLinkBackend.spec

      # ── 3. Electron frontend ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ElectronFrontEnd/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: ElectronFrontEnd

      # Rename product so installer filename is distinct from single-channel
      - name: Set MindRove product name and version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^[vn]' -replace '-mindrove$'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.build.productName = "Mindlink Analyzer 4C"
          $pkg.version = $version
          $pkg.build.publish.channel = "mindrove"
          $pkg.build.publish.releaseType = "prerelease"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
        working-directory: ElectronFrontEnd

      # ── 4. Pre-release page commit — must happen BEFORE publish so the GitHub
      #       release tag points to a commit named "release: mindrove vX",
      #       not the previous product's commit. ────────────────────────────────
      - name: Pre-release page commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone https://x-access-token:$env:GH_TOKEN@github.com/Mindspeller/MindLink-Releases.git releases-repo
          cd releases-repo
          $version = $env:TAG -replace '^[vn]' -replace '-mindrove$'
          Set-Content -Path mindrove-version.txt -Value $version -Encoding UTF8
          powershell -ExecutionPolicy Bypass -File generate-page.ps1
          git config user.email "ci@mindspeller.com"
          git config user.name "MindLink CI"
          git add mindrove-version.txt index.html
          git diff --cached --quiet || git commit -m "release: mindrove v$version"
          git push

      # ── 5. Build & publish — release tag now points to the commit above ───────
      - name: Build and publish release
        run: npm run package -- --publish always
        working-directory: ElectronFrontEnd
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}

      # ── 6. Remove stale latest.yml from release ───────────────────────────────
      - name: Delete latest.yml from release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^[vn]' -replace '-mindrove$'
          gh release delete-asset v$version latest.yml --yes --repo Mindspeller/MindLink-Releases 2>$null
          exit 0
        shell: pwsh

      # ── 7. Upload update feed yml to GitHub Pages ─────────────────────────────
      - name: Upload update feed yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          cd releases-repo
          git pull
          $version = $env:TAG -replace '^[vn]' -replace '-mindrove$'
          $baseUrl = "https://github.com/Mindspeller/MindLink-Releases/releases/download/v$version"
          $ymlSrc = [System.IO.File]::ReadAllText("$env:GITHUB_WORKSPACE\ElectronFrontEnd\release\mindrove.yml", [System.Text.Encoding]::UTF8)
          $ymlSrc = [regex]::Replace($ymlSrc, '(?m)^(  - url: |path: )(?!https://)', "`$1$baseUrl/")
          New-Item -ItemType Directory -Force -Path mindrove-updates | Out-Null
          [System.IO.File]::WriteAllText("$PWD\mindrove-updates\latest.yml", $ymlSrc, [System.Text.Encoding]::UTF8)
          git add mindrove-updates/latest.yml
          git diff --cached --quiet || git commit -m "update: mindrove v$version update feed"
          git push
