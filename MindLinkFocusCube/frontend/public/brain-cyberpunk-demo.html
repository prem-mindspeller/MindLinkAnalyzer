<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyberpunk EEG Brain Visualization</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      .hud {
        position: fixed;
        left: 18px;
        bottom: 18px;
        display: flex;
        gap: 16px;
        color: #d8f7ff;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(0, 243, 255, 0.24);
        border-radius: 8px;
        padding: 10px 12px;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .hud span {
        color: #8ea7b3;
        display: block;
        font-size: 11px;
      }

      .hud strong {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div><span>Alpha</span><strong id="alpha-readout">0.00</strong></div>
      <div><span>Beta/Gamma</span><strong id="beta-readout">0.00</strong></div>
      <div><span>Region</span><strong>Prefrontal sensor view</strong></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
      window.currentAlpha = 0.35;
      window.currentBeta = 0.25;

      const COLORS = {
        alpha: new THREE.Color("#00f3ff"),
        beta: new THREE.Color("#ff007f"),
        shell: new THREE.Color("#607280"),
      };

      const app = document.getElementById("app");
      const alphaReadout = document.getElementById("alpha-readout");
      const betaReadout = document.getElementById("beta-readout");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5.8);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 1);
      app.appendChild(renderer.domElement);

      const root = new THREE.Group();
      scene.add(root);

      function clamp(value, min = 0, max = 1) {
        return Math.min(max, Math.max(min, Number.isFinite(value) ? value : 0));
      }

      function lowFrequencyNoise(x, y) {
        return (
          Math.sin(x * 2.1 + y * 0.7) * 0.045 +
          Math.sin(x * -1.3 + y * 2.6 + 1.7) * 0.035 +
          Math.cos(x * 3.2 - y * 1.4) * 0.025
        );
      }

      function brainShellPoint(angleUnit, radiusUnit, hemisphere) {
        const angle = angleUnit * Math.PI * 2;
        const side = hemisphere === "left" ? -1 : 1;
        const radial = 0.18 + clamp(radiusUnit) * 0.82;
        const pinch = 1 - Math.abs(Math.sin(angle)) * 0.1;
        const anteriorBulge = 1 + Math.max(0, Math.sin(angle)) * 0.18;
        const posteriorTaper = 1 - Math.max(0, -Math.sin(angle)) * 0.16;
        const localX = Math.cos(angle) * 0.86 * pinch * radial;
        const localY = Math.sin(angle) * 1.26 * anteriorBulge * posteriorTaper * radial;
        const x = side * 0.18 + side * Math.abs(localX);
        const y = localY + lowFrequencyNoise(localX, localY);
        const z = lowFrequencyNoise(x * 1.8, y * 1.8) * 0.9;
        return { x, y, z };
      }

      function prefrontalWeight(point) {
        const yWeight = clamp((point.y + 0.35) / 1.45);
        const centerWeight = 1 - clamp(Math.abs(point.x) / 1.35);
        return clamp(yWeight * 0.78 + centerWeight * 0.22);
      }

      function makeLineLoop(points, color, opacity) {
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
        return new THREE.LineLoop(geometry, material);
      }

      function createBrainWireframe() {
        const group = new THREE.Group();
        for (const hemisphere of ["left", "right"]) {
          const outline = [];
          for (let i = 0; i < 180; i++) {
            const p = brainShellPoint(i / 180, 1, hemisphere);
            outline.push(new THREE.Vector3(p.x, p.y, p.z - 0.06));
          }
          group.add(makeLineLoop(outline, COLORS.shell, 0.62));

          for (let ring = 0; ring < 7; ring++) {
            const contour = [];
            const radius = 0.24 + ring * 0.1;
            for (let i = 0; i < 140; i++) {
              const p = brainShellPoint(i / 140 + ring * 0.021, radius, hemisphere);
              contour.push(new THREE.Vector3(p.x, p.y, p.z + 0.01));
            }
            group.add(makeLineLoop(contour, 0x9fb2c3, 0.18));
          }
        }

        const fissure = [];
        for (let i = 0; i <= 100; i++) {
          const y = -1.15 + (i / 100) * 2.55;
          fissure.push(new THREE.Vector3(Math.sin(i * 0.24) * 0.03, y, 0.04));
        }
        group.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(fissure),
          new THREE.LineBasicMaterial({ color: 0xb9c9d8, transparent: true, opacity: 0.5 })
        ));

        const prefrontal = [];
        for (let i = 0; i < 120; i++) {
          const a = (i / 120) * Math.PI * 2;
          prefrontal.push(new THREE.Vector3(Math.cos(a) * 0.75, 1.18 + Math.sin(a) * 0.24, 0.08));
        }
        group.add(makeLineLoop(prefrontal, COLORS.beta, 0.42));
        return group;
      }

      function createParticles(color, count, mode) {
        const positions = new Float32Array(count * 3);
        const base = new Float32Array(count * 3);
        const weights = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          const hemisphere = i % 2 === 0 ? "left" : "right";
          const angleUnit = (i * 0.61803398875) % 1;
          const radiusUnit = mode === "prefrontal" ? 0.46 + Math.random() * 0.54 : Math.random();
          const p = brainShellPoint(angleUnit, radiusUnit, hemisphere);
          const w = prefrontalWeight(p);
          const pull = mode === "prefrontal" ? w * 0.55 : 0;
          const x = p.x * (1 - pull * 0.2);
          const y = p.y + pull * 0.38;
          const z = p.z + (Math.random() - 0.5) * 0.06;
          positions[i * 3] = base[i * 3] = x;
          positions[i * 3 + 1] = base[i * 3 + 1] = y;
          positions[i * 3 + 2] = base[i * 3 + 2] = z;
          weights[i] = w;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
          color,
          size: 0.018,
          transparent: true,
          opacity: 0.62,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const points = new THREE.Points(geometry, material);
        points.userData = { base, weights, mode };
        return points;
      }

      const brain = createBrainWireframe();
      const alphaParticles = createParticles(COLORS.alpha, 5000, "distributed");
      const betaParticles = createParticles(COLORS.beta, 5000, "prefrontal");
      root.add(brain, alphaParticles, betaParticles);

      scene.add(new THREE.AmbientLight(0x4f6d7a, 0.8));

      function animateParticles(points, intensity, time) {
        const pos = points.geometry.attributes.position;
        const { base, weights, mode } = points.userData;
        const speed = mode === "prefrontal" ? 0.006 + intensity * 0.018 : 0.003 + intensity * 0.008;
        const expansion = mode === "prefrontal" ? 0.04 + intensity * 0.2 : 0.025 + intensity * 0.14;

        for (let i = 0; i < pos.count; i++) {
          const ix = i * 3;
          const weight = mode === "prefrontal" ? weights[i] : 0.58;
          const wave = Math.sin(time * speed + i * 0.09) * expansion * weight;
          const spark = mode === "prefrontal" && Math.sin(time * 0.025 + i * 7.13) > 0.985
            ? intensity * 0.34 * weight
            : 0;
          const scale = 1 + wave + spark;
          pos.array[ix] = base[ix] * scale;
          pos.array[ix + 1] = base[ix + 1] * scale + spark * 0.26;
          pos.array[ix + 2] = base[ix + 2] + Math.sin(time * speed + i) * 0.035 * intensity;
        }

        points.material.opacity = mode === "prefrontal" ? 0.16 + intensity * 0.84 : 0.18 + intensity * 0.72;
        points.material.size = mode === "prefrontal" ? 0.012 + intensity * 0.038 : 0.012 + intensity * 0.026;
        pos.needsUpdate = true;
      }

      function render(time) {
        const alpha = clamp(window.currentAlpha);
        const beta = clamp(window.currentBeta);
        alphaReadout.textContent = alpha.toFixed(2);
        betaReadout.textContent = beta.toFixed(2);
        animateParticles(alphaParticles, alpha, time);
        animateParticles(betaParticles, beta, time);
        root.rotation.z = Math.sin(time * 0.0002) * 0.035;
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      setInterval(() => {
        window.currentAlpha = clamp(window.currentAlpha * 0.72 + Math.random() * 0.28);
        window.currentBeta = clamp(window.currentBeta * 0.62 + Math.random() * 0.38);
      }, 100);

      requestAnimationFrame(render);
    </script>
  </body>
</html>
